<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <main>
        <section class="container">
            <section class="bx-1">
                <form action="">
                    <input type="text" placeholder="Name of Author" id="author_name" name="author">
                    <input type="text" name="title" id="book_title" placeholder="Book Title">
                    <input type="number" name="pages" id="book_pages" placeholder="Book Pages">
                </form>
                <div class="button-container">
                    <button type="button" id="btn">Add</button>
                    <small>Created by Rachel Abit</small>
                </div>
            </section>
            <section class="bx-2">
                <h1>My Library</h1>
            </section>
            <section class="bx-3">
                <div class="contents"></div>
            </section>
        </section>    
    </main>

    <script src="main.js" ></script>

</body>
</html>
